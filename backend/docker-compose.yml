name: skn28-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn28-backend:dev
    container_name: skn28-backend-dev
    restart: unless-stopped
    ports:
      - target: 8000
        published: "${BACKEND_HOST_PORT:-8001}"
        host_ip: "${BACKEND_HOST_BIND:-127.0.0.1}"
        protocol: tcp
    environment:
      LLM_PROVIDER_OPENAI_API_KEY: "${LLM_PROVIDER_OPENAI_API_KEY:-}"
      LLM_PROVIDER_OPENROUTER_API_KEY: "${LLM_PROVIDER_OPENROUTER_API_KEY:-}"
      LLM_PROVIDER_CEREBRAS_API_KEY: "${LLM_PROVIDER_CEREBRAS_API_KEY:-}"
      METADATA_NAME: "${METADATA_NAME:-SKN28 Backend}"
      METADATA_VERSION: "${METADATA_VERSION:-0.1.0}"
      RUNTIME_HOST: "0.0.0.0"
      RUNTIME_PORT: "8000"
      RUNTIME_RELOAD: "false"
      RUNTIME_CORS_ORIGINS: '${RUNTIME_CORS_ORIGINS:-["http://localhost:8501","http://127.0.0.1:8501","http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]}'
      RUNTIME_LOG_LEVEL: "${RUNTIME_LOG_LEVEL:-INFO}"
      LLM_AGENT_MAIN_PROVIDER: "${LLM_AGENT_MAIN_PROVIDER:-cerebras}"
      LLM_AGENT_MAIN_MODEL: "${LLM_AGENT_MAIN_MODEL:-gpt-oss-120b}"
      LLM_AGENT_SANITIZE_PROVIDER: "${LLM_AGENT_SANITIZE_PROVIDER:-}"
      LLM_AGENT_SANITIZE_MODEL: "${LLM_AGENT_SANITIZE_MODEL:-}"
      LLM_AGENT_WINDOW_PROVIDER: "${LLM_AGENT_WINDOW_PROVIDER:-}"
      LLM_AGENT_WINDOW_MODEL: "${LLM_AGENT_WINDOW_MODEL:-}"
      LLM_REQUEST_TIMEOUT_MS: "${LLM_REQUEST_TIMEOUT_MS:-60000}"
      LLM_REQUEST_MAX_RETRIES: "${LLM_REQUEST_MAX_RETRIES:-2}"
      LLM_RESPONSE_MAX_TOKENS: "${LLM_RESPONSE_MAX_TOKENS:-}"
      LLM_PROVIDER_OPENAI_BASE_URL: "${LLM_PROVIDER_OPENAI_BASE_URL:-}"
      LLM_PROVIDER_OPENROUTER_APP_TITLE: "${LLM_PROVIDER_OPENROUTER_APP_TITLE:-SKN28 Backend Agent}"
      LLM_PROVIDER_OPENROUTER_APP_URL: "${LLM_PROVIDER_OPENROUTER_APP_URL:-}"
      LLM_PROVIDER_OPENROUTER_BASE_URL: "${LLM_PROVIDER_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      LLM_PROVIDER_OPENROUTER_PROVIDER_ORDER: '${LLM_PROVIDER_OPENROUTER_PROVIDER_ORDER:-[]}'
      LLM_PROVIDER_OPENROUTER_ALLOW_FALLBACKS: "${LLM_PROVIDER_OPENROUTER_ALLOW_FALLBACKS:-true}"
      LLM_PROVIDER_OPENROUTER_REQUIRE_PARAMETERS: "${LLM_PROVIDER_OPENROUTER_REQUIRE_PARAMETERS:-false}"
      LLM_PROVIDER_CEREBRAS_BASE_URL: "${LLM_PROVIDER_CEREBRAS_BASE_URL:-}"
      RAG_MCP_URL: "${RAG_MCP_URL:-http://127.0.0.1:8010/mcp}"
      RAG_TOOLS_ENABLED: "${RAG_TOOLS_ENABLED:-true}"
      RAG_TOOL_TIMEOUT_MS: "${RAG_TOOL_TIMEOUT_MS:-30000}"
